name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Headless bilingual desktop UI smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "import sys;sys.path.insert(0,'src');from PySide6.QtWidgets import QApplication;from autobackup.ui import MainWindow;app=QApplication([]);w=MainWindow();assert w.windowTitle().startswith('AutoBackup');w.close();print('Qt UI OK')"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Download and SHA-256 verify restic 0.20.0
        shell: pwsh
        run: |
          $url = "https://github.com/restic/restic/releases/download/v0.20.0/restic_0.20.0_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "restic.zip"
          $expected = "bba9061c3dce081701ab353ec8cb73a78be73b71a538aad560f2d1067602b7fe"
          $found = (Get-FileHash "restic.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($found -ne $expected) { throw "restic checksum mismatch: $found" }
          Expand-Archive "restic.zip" -DestinationPath "restic_unpacked"
          $binary = Get-ChildItem -Path "restic_unpacked" -Recurse -Filter "*windows_amd64.exe" | Select-Object -First 1
          if ($null -eq $binary) { throw "restic.exe missing from verified release" }
          Copy-Item $binary.FullName "restic.exe"
          & .\restic.exe version
      - name: Local encrypted backup and restore integration test
        shell: pwsh
        run: |
          $env:AUTOBACKUP_RESTIC = (Resolve-Path .\restic.exe).Path
          python -m unittest discover -s tests -p 'test_restic_integration.py' -v
      - name: Build desktop app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name AutoBackup --paths src --collect-all keyring --add-binary "restic.exe;." main.py
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup missing" }
          & $iscc "installer\AutoBackup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBackup-Windows-Installer
          path: output/AutoBackup-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
